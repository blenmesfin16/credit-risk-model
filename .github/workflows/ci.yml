# GitHub Actions CI/CD Pipeline for Credit Risk Model
# Task 6 - Continuous Integration

name: CI/CD Pipeline

on:
  push:
    branches: [ main, task-* ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov
        pip install -r requirements.txt
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: false
    
    - name: Create mock model for testing (if needed)
      run: |
        mkdir -p models
        # Create a dummy model file if not exists (for CI)
        if [ ! -f models/best_model_production.pkl ]; then
          python -c "
import joblib
from sklearn.ensemble import RandomForestClassifier
import pandas as pd
import numpy as np
# Create dummy training data
X = pd.DataFrame(np.random.rand(100, 5), columns=['TotalTransactionAmount', 'AverageTransactionAmount', 'TransactionCount', 'StdDevTransactionAmount', 'Recency'])
y = np.random.randint(0, 2, 100)
model = RandomForestClassifier(n_estimators=10, random_state=42)
model.fit(X, y)
joblib.dump(model, 'models/best_model_production.pkl')
joblib.dump(['TotalTransactionAmount', 'AverageTransactionAmount', 'TransactionCount', 'StdDevTransactionAmount', 'Recency'], 'models/feature_columns.pkl')
"
        fi
    
    - name: Test with pytest
      run: |
        pytest tests/ -v --tb=short --cov=src --cov-report=xml
      continue-on-error: false
    
    - name: Upload coverage report
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  build-docker:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        docker build -t credit-risk-api:latest .
        docker images